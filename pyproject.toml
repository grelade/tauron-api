[project]
name = "tauron-ebok"
version = "0.1.0"
description = "Unofficial Python SDK and CLI for TAURON eBOK (moj.tauron.pl): balance, invoices, PDFs, payments, messages, energy consumption."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacek Grela", email = "jacekgrela@gmail.com" }]
requires-python = ">=3.10"
keywords = ["tauron", "ebok", "moj-tauron", "energy", "invoices", "sdk", "scraper"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Polish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/grelade/tauron-ebok"
Issues = "https://github.com/grelade/tauron-ebok/issues"

[project.scripts]
tauron-ebok = "tauron_ebok.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-cov>=5",
    "responses>=0.25",
    "ruff>=0.6",
    "types-requests>=2.31",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "API.md", "AGENTS.md", "README.md", "LICENSE"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Polish text contains look-alike characters by design

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["responses.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: hits the real moj.tauron.pl (needs TAURON_USER/TAURON_PASS and TAURON_LIVE=1)"]
