  function changeName(button) {
    var input = $(button).closest("div").find("input");
    console.log(input.data("agreement-id"));

    $.ajax({
      url: "/api/sitecore/EbokInvoiceList/SetName",
      data: {
        contractorId: input.data("agreement-id"),
        newName: input.val()
      },
      cache: false,
      type: "POST",
      success: function (data) {
        $(button).closest(".header-container").find("h3").text(data);
        $(button).closest('.msp-item').next().next().next().children(".ebok-pop-up").find('h3').text(data);

      },
      complete: function () {
        $(button).parent().find(".btn-no").click();
      },
      error: function() {
      }
    });
  }

  function loadMoreItems(asyncPar) {
      if (asyncPar === undefined) {
      asyncPar = true;
    }
    if (totalItems != null && currentItemCount >= totalItems) {
      return;
      }
    $.ajax({
      url: "/api/sitecore/EbokInvoiceList/LoadMoreInvoicesProducts?sid=T18&amp;pp=12345678",
      async: asyncPar,
      data: {
        startingIndex: currentItemCount,
        searchTerm: searchTerm,
        PickupMediumType: mediumType,
        parentViewModel: serializedViewModel
      },
      timeout: 10000,
      cache: false,
      type: "POST",
      success: function (data) {
        $("#itemList").append(data.ResultHtml);
        totalItems = data.TotalCount;
        currentItemCount += data.ReturnedCount;
        dataTableLayout.initAutoDownload();
        $('.msp-item .btn-msp-popup').off('click').on('click', function () {
          $(this).parents('.msp-item').next().next().next().children(".ebok-pop-up").toggle();
        });
        $('#itemList .popup-close').off('click').on('click', function () {
          $(this).closest('.ebok-pop-up').hide();
        });

        var ajaxModelCount = totalItems - currentItemCount;
        if (currentItemCount < 2) {
          $("#payAllInvoices").hide();
        }
        if (ajaxModelCount <= 0) {
          $(".table-layout-bottom").hide();
          $(".table-layout.table-placeholder").addClass("last-visible-row");
        }
        else {
          $(".table-layout-bottom").show();
          $(".table-layout.table-placeholder").removeClass("last-visible-row");
        }
        SetSum(false);
        dataTableLayout.updateControlls();
        if (!isInitExpanded) {
          jQuery("[data-expand-init='true']").click();
          isInitExpanded = true;
        }
        for (var e = document.querySelectorAll(".installment-schedule-wrapper"), t = 0; t < e.length; t++)
          new InstallmentScheduleComponent(e[t])

        console.error("test");
        for (var e = document.querySelectorAll("[data-invoices]"), t = 0; t < e.length; t++) {
          new InvoicesFiltersComponent(e[t]);
        }
        new Datepicker();
        new Spinner();
      },
      complete: function() {
      },
      error: function () {
        alert("Problem z pobraniem listy faktur. Proszę spróbować później");
      }
    });
  }

  function SetSum(asyncPar) {
    var idArray = [];
    $("input:checked[data-charge-id]").each(function () {
      var item = {
        chargeId : $(this).attr('data-charge-id'),
        chargeValue : $(this).attr('data-charge-value')
      }
      idArray.push(item);
    });
    idArray = unique(idArray);
    var res = sum(idArray);
    dataTableLayout.updateSumControll($("#ebok-charges-all-sum"), res);

    $(".table-inside").each(function () {
      var sumItem = $(".sum-wrapper .amount", $(this)).first();
      var idArray = [];
      $("input[data-charge-id]:checked", $(this).children(".table-wrapper").first()).each(function () {
        var item = {
          chargeId: $(this).attr('data-charge-id'),
          chargeValue: $(this).attr('data-charge-value')
        }
        idArray.push(item);
      });
      idArray = unique(idArray);
      var res = sum(idArray);
      dataTableLayout.updateSumControll(sumItem, res);
    });
  }

  function unique(list) {
    var result = [];
    $.each(list, function (i, e) {
      if ($.inArray(e, result) == -1) result.push(e);
    });
    return result;
  }

  function sum(list) {
    var total = parseFloat(0, 10);
    $.each(list, function () {
      total += parseFloat(this.chargeValue.replace(',', '.'));
    });

    return total.toFixed(2).replace(',', '.');
  }
